# Template only: no real values are committed. Create the real Secret with
#
#   kubectl create secret generic ai-qa-secrets \
#     --from-literal=JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=ADMIN_USERNAME=admin \
#     --from-literal=ADMIN_PASSWORD='<choose one>' \
#     --from-literal=OPENAI_API_KEY='<if using a real provider>'
#
# In production, sync it from AWS Secrets Manager (External Secrets Operator)
# rather than creating it by hand.
apiVersion: v1
kind: Secret
metadata:
  name: ai-qa-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE_ME"
  OPENAI_API_KEY: ""
