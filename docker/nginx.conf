# nginx as the local load balancer (the role an AWS ALB plays in production).

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # "app" is the Compose service name. Docker's DNS returns one address per
    # replica; nginx resolves the name when it starts and round-robins across
    # all of them. After changing the replica count, reload nginx so it picks
    # up the new set:  docker compose exec nginx nginx -s reload
    upstream api {
        server app:8000 max_fails=3 fail_timeout=10s;   # passive health check
        keepalive 64;
    }

    # Hide the nginx version from responses.
    server_tokens off;

    # Access log with timings and the replica that served each request.
    # (No query strings or headers are logged, so no tokens end up here.)
    log_format timed '$remote_addr "$request_method $uri" $status '
                     'request_time=$request_time upstream_time=$upstream_response_time '
                     'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log timed;

    server {
        listen 80;

        # Reject oversized bodies at the edge, before they reach Python.
        client_max_body_size 300k;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # enables upstream keep-alive
            proxy_set_header Host $host;
            # Overwrite (never append to) the client-supplied value, so the app
            # can trust X-Real-IP for login throttling.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;                  # above LLM_OVERALL_DEADLINE_SECONDS
            # If a replica refuses the connection, try the next one. Requests
            # that already reached a replica are not replayed (POST is not idempotent).
            proxy_next_upstream error timeout;
        }
    }
}
