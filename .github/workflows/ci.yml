name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # The suite needs no services and no API key: Qdrant runs in-memory,
      # Redis is fakeredis, the LLM is the mock provider.
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r requirements.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-qa-platform:ci .
