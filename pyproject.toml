[project]
name = "ai-qa-platform"
version = "1.0.0"
description = "AI Question-Answering API: FastAPI, JWT/RBAC, Redis, Qdrant (vector DB + RAG), LLM gateway."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs real Redis and Qdrant (docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d qdrant redis)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/database/seed.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and literal test credentials
"scripts/**" = ["S101", "S310"]
